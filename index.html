<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صن فلاور – العين السخنة</title>
<meta name="description" content="منتجع صن فلاور على ساحل البحر الأحمر بالعين السخنة: فنادق للسياحة وشاليهات للتمليك">
<meta property="og:title" content="صن فلاور – العين السخنة">
<meta property="og:description" content="منتجع متكامل يمتد من الطريق حتى البحر">
<meta property="og:image" content="og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0F1A24; --panel: #16283A; --gold: #D9A84E; --text: #F4EDE2; --muted: #B9C3CB; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Tajawal', sans-serif; overflow: hidden;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .stage { position: fixed; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .frame { position: relative; width: min(100%, calc((100vh - 88px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
           background: #000 center / contain no-repeat; box-shadow: 0 20px 60px rgba(0,0,0,0.5); transition: opacity .25s ease; }
  .frame::after { content: ""; position: absolute; inset: 0; }            /* shield: the slide is a background, not a saveable <img> */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: center; gap: 14px;
         background: var(--panel); border-top: 1px solid rgba(255,255,255,0.08); padding: 0 16px; }
  button { font: 700 16px 'Tajawal', sans-serif; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
           border-radius: 22px; padding: 8px 18px; cursor: pointer; }
  button:hover { background: rgba(217,168,78,0.25); border-color: var(--gold); }
  button:disabled { opacity: .35; cursor: default; }
  .count { min-width: 74px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { position: fixed; left: 0; right: 0; bottom: 64px; height: 3px; background: rgba(255,255,255,0.06); }
  .progress i { display: block; height: 100%; background: var(--gold); transition: width .25s ease; margin-right: 0; margin-left: auto; }
  .brand { position: absolute; right: 16px; color: var(--gold); font-weight: 700; }
  @media (max-width: 640px) { .brand { display: none; } button { padding: 8px 12px; } #fs { display: none; } }
  @media print { body { display: none; } }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">
<div class="stage"><div class="frame" id="frame" role="img" aria-label="شريحة العرض"></div></div>
<div class="progress"><i id="prog"></i></div>
<div class="bar">
  <span class="brand">صن فلاور</span>
  <button id="prev" aria-label="الشريحة السابقة">السابق ›</button>
  <span class="count" id="count"></span>
  <button id="next" aria-label="الشريحة التالية">‹ التالي</button>
  <button id="fs" aria-label="ملء الشاشة">ملء الشاشة</button>
</div>
<script>
  const N = 44, frame = document.getElementById('frame');
  const src = i => 's/' + String(i).padStart(2, '0') + '.webp';
  let cur = Math.min(Math.max(parseInt(location.hash.slice(1)) || 1, 1), N);
  const cache = {};
  function preload(i) { if (i >= 1 && i <= N && !cache[i]) { cache[i] = new Image(); cache[i].src = src(i); } }
  function show(i) {
    cur = Math.min(Math.max(i, 1), N);
    frame.style.backgroundImage = 'url(' + src(cur) + ')';
    document.getElementById('count').textContent = cur + ' / ' + N;
    document.getElementById('prog').style.width = (cur / N * 100) + '%';
    document.getElementById('prev').disabled = cur === 1;
    document.getElementById('next').disabled = cur === N;
    history.replaceState(null, '', '#' + cur);
    preload(cur + 1); preload(cur + 2); preload(cur - 1);
  }
  document.getElementById('next').onclick = () => show(cur + 1);
  document.getElementById('prev').onclick = () => show(cur - 1);
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  frame.onclick = e => { const r = frame.getBoundingClientRect(); show(e.clientX < r.left + r.width / 2 ? cur + 1 : cur - 1); };  // RTL: left half = next
  document.addEventListener('keydown', e => {
    if (['ArrowLeft', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (['ArrowRight', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(1); else if (e.key === 'End') show(N);
    if ((e.ctrlKey || e.metaKey) && ['s', 'p'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  let tx = null;
  frame.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) show(dx > 0 ? cur + 1 : cur - 1); tx = null; });
  show(cur);
</script>
</body>
</html>
